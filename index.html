    function HeroSection() {
      const videoRef = useRef(null);

        const video = document.getElementById('hero-loop-video');
        if (!video) return;
        videoRef.current = video;

        // Enforce DOM muted properties
        video.muted = true;
        video.defaultMuted = true;
        video.volume = 0;

        const startVideo = () => {
          const p = video.play();
          if (p !== undefined) {
            p.catch((err) => {
              console.log("Autoplay waiting for initial interaction:", err);
            });
          }
        };

        startVideo();

        // Fallback interaction listener to guarantee playback across all browsers
        const handleInteraction = () => {
          if (video && video.paused) {
            startVideo();
          }
        };

        window.addEventListener('click', handleInteraction, { passive: true });
        window.addEventListener('scroll', handleInteraction, { passive: true });
        window.addEventListener('touchstart', handleInteraction, { passive: true });

        return () => {
          window.removeEventListener('click', handleInteraction);
          window.removeEventListener('scroll', handleInteraction);
          window.removeEventListener('touchstart', handleInteraction);
        };
      }, []);
